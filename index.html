<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Công Chúa Của Anh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PHẦN NHẬP MẬT KHẨU -->
    <div class="card" id="login-card">
        <div class="title" id="status-text">Hãy nhập ngày sinh của công chúa</div>
        <div class="content">
            <div class="image-box">
                <img src="anh2.jpg" alt="Avatar">
            </div>
            <div class="keypad">
                <div class="display-dots" id="dots">_ _ _ _</div>
                <button class="key" onclick="press('1')">1</button>
                <button class="key" onclick="press('2')">2</button>
                <button class="key" onclick="press('3')">3</button>
                <button class="key" onclick="press('4')">4</button>
                <button class="key" onclick="press('5')">5</button>
                <button class="key" onclick="press('6')">6</button>
                <button class="key" onclick="press('7')">7</button>
                <button class="key" onclick="press('8')">8</button>
                <button class="key" onclick="press('9')">9</button>
                <button class="key" onclick="clearInput()" style="grid-column: span 3; font-size: 14px; background: #ffebee; color: #c62828;">C</button>
            </div>
        </div>
    </div>

    <!-- PHẦN THIỆP CHÚC MỪNG (Bố cục ngang giống hệt mẫu) -->
    <div class="card" id="wish-card" style="display: none;">
        <div class="wish-container">
            <img src="anh2.jpg" alt="Wish Image" class="wish-img">
            <div class="wish-text">
                <h3>Gửi emm beee,</h3>
                <!-- Hộp văn bản chạy máy đánh chữ -->
                <p id="hộp văn bản"></p>
            </div>
        </div>
    </div>

    <!-- Âm thanh nền -->
    <audio id="âm thanh của tôi" src="yeu.mp3" preload="auto" loop></audio>

    <script src="script.js"></script>
</body>
</html>
