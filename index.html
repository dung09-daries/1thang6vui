<!DOCTYPE html>
<html lang="vi">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Emm Bee Yêu ❤️</title>
    <!-- Liên kết với file giao diện CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Nút bấm mở quà và kích hoạt nhạc -->

    <script src="script.js"></script>
